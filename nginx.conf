server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';" always;

    # --- SPA routing ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Proxy vers le tableau de vols officiel de l'aéroport (CCI-NC) ---
    # Données publiques, aucune clé requise (ADR-0004). Le navigateur reste en
    # same-origin (connect-src 'self') ; la CCI n'est jamais contactée côté client.
    location /cci/ {
        proxy_pass https://www.aeroports.cci.nc/;
        proxy_ssl_server_name on;
        proxy_set_header Host www.aeroports.cci.nc;
        proxy_set_header User-Agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        proxy_set_header Accept "text/html";

        # Ne pas transmettre les cookies/headers du client
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
    }

    # --- Cache assets statiques ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- Compression ---
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
